<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Python List Master: 100+ Functions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <style>
        :root {
            --bg: #020617;
            --card-bg: rgba(30, 41, 59, 0.5);
            --accent: #38bdf8;
            --yellow: #fbbf24;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #f1f5f9;
            font-family: 'Poppins', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 20px;
        }

        .header { text-align: center; padding: 60px 20px; }
        .header h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; }
        .header span { color: var(--yellow); }
        
        /* =========================
   STICKY CONTROLS
========================= */

.controls{

    max-width:1000px;

    margin:-20px auto 40px;

    display:flex;

    flex-direction:column;

    gap:18px;

    background:rgba(15,23,42,0.72);

    padding:20px;

    border-radius:24px;

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    position:sticky;

    top:15px;

    z-index:1000;

    transition:
    transform 0.35s ease,
    padding 0.35s ease,
    max-width 0.35s ease,
    border-radius 0.35s ease,
    opacity 0.35s ease,
    box-shadow 0.35s ease;

    transform-origin:top center;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.35);
}

/* =========================
   SEARCH BOX
========================= */

.search-box{

    position:relative;

    width:100%;
}

.search-box input{

    width:100%;

    padding:15px 50px;

    background:rgba(0,0,0,0.3);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:14px;

    color:white;

    font-size:16px;

    outline:none;

    transition:
    all 0.35s ease;

    font-family:'Poppins',sans-serif;
}

.search-box input:focus{

    border-color:#38bdf8;

    box-shadow:
    0 0 0 4px rgba(56,189,248,0.15);
}

.search-box i{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#38bdf8;

    font-size:15px;

    transition:0.35s ease;
}

/* =========================
   FILTER BUTTONS
========================= */

.filters{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    justify-content:center;
}

.filter-btn{

    padding:10px 18px;

    border-radius:999px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    color:#94a3b8;

    cursor:pointer;

    transition:0.3s ease;

    font-size:13px;

    font-weight:600;

    font-family:'Poppins',sans-serif;
}

.filter-btn:hover{

    transform:translateY(-2px);

    border-color:#38bdf8;

    color:white;
}

.filter-btn.active{

    background:#38bdf8;

    color:#02131d;

    border-color:#38bdf8;

    box-shadow:
    0 5px 20px rgba(56,189,248,0.35);
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .controls{

        top:10px;

        padding:16px;

        border-radius:18px;
    }

    .filters{

        justify-content:flex-start;

        overflow-x:auto;

        flex-wrap:nowrap;

        padding-bottom:5px;
    }

    .filters::-webkit-scrollbar{

        display:none;
    }

    .filter-btn{

        white-space:nowrap;
    }

    .search-box input{

        font-size:14px;
    }
}
    </style>
</head>
<body>

<div class="header">
    <h1>PYTHON <span>LIST</span> ENCYCLOPEDIA</h1>
    <p>100+ Built-in Methods, Library Functions & Logic Patterns</p>
</div>

<div class="controls">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="mainSearch" placeholder="Search 100+ functions (e.g. 'random', 'sort', 'math')..." onkeyup="renderCards()">
    </div>
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" onclick="filterCat('all')">All</button>
        <button class="filter-btn" onclick="filterCat('Method')">Methods</button>
        <button class="filter-btn" onclick="filterCat('Built-in')">Built-ins</button>
        <button class="filter-btn" onclick="filterCat('itertools')">Itertools</button>
        <button class="filter-btn" onclick="filterCat('math')">Math/Stats</button>
        <button class="filter-btn" onclick="filterCat('random')">Random</button>
        <button class="filter-btn" onclick="filterCat('collections')">Collections</button>
    </div>
</div>

<div class="stats-counter" id="countDisplay">Showing 0 Functions</div>

<div class="grid" id="functionGrid">
    <!-- Cards injected by JS -->
</div>

<script>

const data = [

/* =========================
   LIST METHODS
========================= */

{
    name:"append()",
    cat:"Method",
    imp:"None",
    desc:"Adds one item to the end of the list.",
    code:`nums = [1, 2]

nums.append(3)

print(nums)

# Output:
# [1, 2, 3]`
},

{
    name:"extend()",
    cat:"Method",
    imp:"None",
    desc:"Adds multiple items from another iterable.",
    code:`nums = [1]

nums.extend([2, 3, 4])

print(nums)

# Output:
# [1, 2, 3, 4]`
},

{
    name:"insert()",
    cat:"Method",
    imp:"None",
    desc:"Inserts item at specific position.",
    code:`nums = [1, 3]

nums.insert(1, 2)

print(nums)

# Output:
# [1, 2, 3]`
},

{
    name:"remove()",
    cat:"Method",
    imp:"None",
    desc:"Removes first matching value.",
    code:`nums = [1, 2, 2, 3]

nums.remove(2)

print(nums)

# Output:
# [1, 2, 3]`
},

{
    name:"pop()",
    cat:"Method",
    imp:"None",
    desc:"Removes and returns item.",
    code:`nums = [10, 20, 30]

x = nums.pop()

print(x)
print(nums)

# Output:
# 30
# [10, 20]`
},

{
    name:"clear()",
    cat:"Method",
    imp:"None",
    desc:"Removes all items from list.",
    code:`nums = [1, 2, 3]

nums.clear()

print(nums)

# Output:
# []`
},

{
    name:"sort()",
    cat:"Method",
    imp:"None",
    desc:"Sorts list in ascending order.",
    code:`nums = [4, 1, 3]

nums.sort()

print(nums)

# Output:
# [1, 3, 4]`
},

{
    name:"reverse()",
    cat:"Method",
    imp:"None",
    desc:"Reverses list order.",
    code:`nums = [1, 2, 3]

nums.reverse()

print(nums)

# Output:
# [3, 2, 1]`
},

{
    name:"copy()",
    cat:"Method",
    imp:"None",
    desc:"Creates shallow copy.",
    code:`a = [1, 2]

b = a.copy()

print(b)

# Output:
# [1, 2]`
},

{
    name:"count()",
    cat:"Method",
    imp:"None",
    desc:"Counts occurrence of item.",
    code:`nums = [1, 2, 2, 3]

print(nums.count(2))

# Output:
# 2`
},

{
    name:"index()",
    cat:"Method",
    imp:"None",
    desc:"Returns index of item.",
    code:`nums = ['a', 'b', 'c']

print(nums.index('b'))

# Output:
# 1`
},

/* =========================
   BUILT IN
========================= */

{
    name:"len()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns total items.",
    code:`nums = [1, 2, 3, 4]

print(len(nums))

# Output:
# 4`
},

{
    name:"sum()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns total sum.",
    code:`nums = [1, 2, 3]

print(sum(nums))

# Output:
# 6`
},

{
    name:"max()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns largest item.",
    code:`nums = [5, 1, 9]

print(max(nums))

# Output:
# 9`
},

{
    name:"min()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns smallest item.",
    code:`nums = [5, 1, 9]

print(min(nums))

# Output:
# 1`
},

{
    name:"sorted()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns new sorted list.",
    code:`nums = [4, 1, 3]

result = sorted(nums)

print(result)

# Output:
# [1, 3, 4]`
},

{
    name:"reversed()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns reversed iterator.",
    code:`nums = [1, 2, 3]

print(list(reversed(nums)))

# Output:
# [3, 2, 1]`
},

{
    name:"zip()",
    cat:"Built-in",
    imp:"None",
    desc:"Combines multiple iterables.",
    code:`names = ["A", "B"]
marks = [90, 80]

print(list(zip(names, marks)))

# Output:
# [('A', 90), ('B', 80)]`
},

{
    name:"enumerate()",
    cat:"Built-in",
    imp:"None",
    desc:"Adds index while looping.",
    code:`names = ["A", "B"]

for i, v in enumerate(names):
    print(i, v)

# Output:
# 0 A
# 1 B`
},

{
    name:"map()",
    cat:"Built-in",
    imp:"None",
    desc:"Applies function to all items.",
    code:`nums = [1, 2, 3]

result = list(map(lambda x: x*2, nums))

print(result)

# Output:
# [2, 4, 6]`
},

{
    name:"filter()",
    cat:"Built-in",
    imp:"None",
    desc:"Filters matching values.",
    code:`nums = [1, 2, 3, 4]

result = list(filter(lambda x: x%2==0, nums))

print(result)

# Output:
# [2, 4]`
},

{
    name:"any()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns True if any item is True.",
    code:`nums = [0, False, 5]

print(any(nums))

# Output:
# True`
},

{
    name:"all()",
    cat:"Built-in",
    imp:"None",
    desc:"Returns True if all items are True.",
    code:`nums = [1, True, 5]

print(all(nums))

# Output:
# True`
},

/* =========================
   RANDOM
========================= */

{
    name:"choice()",
    cat:"random",
    imp:"import random",
    desc:"Returns random item.",
    code:`import random

nums = [1, 2, 3]

print(random.choice(nums))`
},

{
    name:"shuffle()",
    cat:"random",
    imp:"import random",
    desc:"Shuffles list.",
    code:`import random

nums = [1, 2, 3, 4]

random.shuffle(nums)

print(nums)`
},

{
    name:"sample()",
    cat:"random",
    imp:"import random",
    desc:"Returns random unique items.",
    code:`import random

nums = [1,2,3,4,5]

print(random.sample(nums, 2))`
},

/* =========================
   MATH
========================= */

{
    name:"mean()",
    cat:"math",
    imp:"import statistics",
    desc:"Returns average value.",
    code:`import statistics

nums = [1,2,3,4]

print(statistics.mean(nums))

# Output:
# 2.5`
},

{
    name:"median()",
    cat:"math",
    imp:"import statistics",
    desc:"Returns middle value.",
    code:`import statistics

nums = [1,2,3,4,5]

print(statistics.median(nums))

# Output:
# 3`
},

{
    name:"mode()",
    cat:"math",
    imp:"import statistics",
    desc:"Returns most common value.",
    code:`import statistics

nums = [1,2,2,3]

print(statistics.mode(nums))

# Output:
# 2`
},

{
    name:"prod()",
    cat:"math",
    imp:"import math",
    desc:"Multiplies all values.",
    code:`import math

nums = [1,2,3,4]

print(math.prod(nums))

# Output:
# 24`
},

/* =========================
   ITERTOOLS
========================= */

{
    name:"chain()",
    cat:"itertools",
    imp:"import itertools",
    desc:"Combines iterables.",
    code:`import itertools

a = [1,2]
b = [3,4]

print(list(itertools.chain(a,b)))

# Output:
# [1,2,3,4]`
},

{
    name:"combinations()",
    cat:"itertools",
    imp:"import itertools",
    desc:"Returns all combinations.",
    code:`import itertools

nums = [1,2,3]

print(list(itertools.combinations(nums,2)))

# Output:
# [(1,2),(1,3),(2,3)]`
},

{
    name:"permutations()",
    cat:"itertools",
    imp:"import itertools",
    desc:"Returns all permutations.",
    code:`import itertools

nums = [1,2]

print(list(itertools.permutations(nums)))

# Output:
# [(1,2),(2,1)]`
},

/* =========================
   COLLECTIONS
========================= */

{
    name:"Counter()",
    cat:"collections",
    imp:"from collections import Counter",
    desc:"Counts frequency of items.",
    code:`from collections import Counter

nums = [1,1,2,3]

print(Counter(nums))

# Output:
# Counter({1:2,2:1,3:1})`
},

{
    name:"deque()",
    cat:"collections",
    imp:"from collections import deque",
    desc:"Fast append and pop.",
    code:`from collections import deque

d = deque([1,2])

d.appendleft(0)

print(d)

# Output:
# deque([0,1,2])`
}

];

let currentCat = 'all';

function filterCat(cat) {

    currentCat = cat;

    document.querySelectorAll('.filter-btn')
    .forEach(btn => btn.classList.remove('active'));

    event.target.classList.add('active');

    renderCards();
}

function renderCards() {

    const grid = document.getElementById('functionGrid');

    const search =
    document.getElementById('mainSearch')
    .value
    .toLowerCase();

    grid.innerHTML = '';

    const filtered = data.filter(item => {

        const matchesSearch =
        item.name.toLowerCase().includes(search) ||
        item.desc.toLowerCase().includes(search);

        const matchesCat =
        currentCat === 'all' ||
        item.cat === currentCat;

        return matchesSearch && matchesCat;
    });

    document.getElementById('countDisplay')
    .innerText = `Showing ${filtered.length} Functions`;

    filtered.forEach(item => {

        const card = document.createElement('div');

        card.className = 'card';

        card.innerHTML = `
            <div class="card-head">
                <span class="category-tag">${item.cat}</span>
                <span class="import-tag">
                    ${item.imp !== 'None' ? item.imp : ''}
                </span>
            </div>

            <h2 class="method-title">${item.name}</h2>

            <p class="desc">${item.desc}</p>

            <div class="code-area">
                <button class="copy-btn"
                onclick="copyCode(this)">
                Copy
                </button>

                <pre><code>${item.code}</code></pre>
            </div>
        `;

        grid.appendChild(card);
    });
}

function copyCode(btn) {

    const code =
    btn.nextElementSibling.innerText;

    navigator.clipboard.writeText(code);

    btn.innerText = "Copied!";

    setTimeout(() => {
        btn.innerText = "Copy";
    }, 1000);
}

renderCards();

</script>

</body>
</html>
